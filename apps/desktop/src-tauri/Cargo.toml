[package]
name = "capybaras-shell"
version = "0.1.0"
description = "Capybaras desktop shell - supervises the Node sidecar"
authors = ["Jeff Marshall"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "capybaras_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sha2 = "0.10"
hex = "0.4"
tauri-build = { version = "2.7.0" }

[dev-dependencies]
# Serialises tests that touch one machine-wide resource. MEASURED, not assumed: the
# credential tests leaked entries on every parallel run and none when run
# single-threaded. See the note in tests/credential.rs.
serial_test = "3"

[dependencies]
sha2 = "0.10"
hex = "0.4"
# The OS credential store (docs/threat-model.md, T12). Preferred over hand-written
# CREDENTIALW marshalling: more code, more pointer-lifetime mistakes, no benefit.
# `windows-native` is REQUIRED. keyring 3.x declares no `default` feature, so a
# bare keyring = "3" enables NO credential store and silently uses a no-op
# backend: save() returns Ok, load() returns None, and every round trip fails as
# if the store were broken. It compiled and lied, which is the worst combination.
keyring = { version = "3", features = ["windows-native"] }
# The OAuth flow primitives (docs/plans/M5-onboarding.md). All three are already
# in the tree transitively via Tauri, so this reuses compiled code rather than
# pulling a new dependency graph.
url = "2"
base64 = "0.21"
getrandom = "0.3"
# The loopback listener (src/loopback.rs). A maintained blocking HTTP server,
# preferred over hand-rolled request parsing: the browser sends more than the GET
# we expect, and none of that handling is interesting enough to own. Adds no
# async runtime to a shell that has none.
tiny_http = "0.12"
# The token exchange (src/exchange.rs). `default-tls` is the OS stack (schannel on
# Windows) rather than a vendored one: this app is Windows-only already, and the OS
# stack is the one that gets updated with the system rather than only on rebuild.
# No `json` feature -- serde_json is already a direct dependency.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
