[package]
name = "capybaras-shell"
version = "0.1.0"
description = "Capybaras desktop shell - supervises the Node sidecar"
authors = ["Jeff Marshall"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "capybaras_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sha2 = "0.10"
hex = "0.4"
tauri-build = { version = "2.7.0" }

[dependencies]
sha2 = "0.10"
hex = "0.4"
# The OS credential store (docs/threat-model.md, T12). Preferred over hand-written
# CREDENTIALW marshalling: more code, more pointer-lifetime mistakes, no benefit.
# `windows-native` is REQUIRED. keyring 3.x declares no `default` feature, so a
# bare keyring = "3" enables NO credential store and silently uses a no-op
# backend: save() returns Ok, load() returns None, and every round trip fails as
# if the store were broken. It compiled and lied, which is the worst combination.
keyring = { version = "3", features = ["windows-native"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
