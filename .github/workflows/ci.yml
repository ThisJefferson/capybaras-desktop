name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # Windows deliberately. The product is a Windows desktop app -- the shell
    # supervises its worker with Windows Job Objects, and the UI smoke test needs
    # Chrome. Checking all of that on Linux would test something we do not ship.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds the generated assets FIRST, because everything downstream needs
      # them: the token stylesheet, and the sidecar bundle that the Rust tests
      # resolve by path. Skipping the generators is how a broken token reference
      # or a stale bundle gets as far as a green test run.
      #
      # The chain is: build tokens (which refuses an unresolvable reference),
      # bundle the sidecar, lint for undefined custom properties, typecheck, and
      # run the TypeScript suite.
      - name: Build, lint, typecheck, unit test
        run: npm run verify

      # The shell's own tests. These drive the REAL sidecar over the REAL pipe,
      # so they need the bundle built by the step above.
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # Renders the interface, asserts on the live DOM (six agents, the card,
      # and that the semantic tokens RESOLVED rather than merely existing), and
      # writes a screenshot.
      - name: UI smoke test
        run: npm run verify:ui

      # So a human can look at what the machine just checked. The assertion says
      # the tokens resolved; only a person can say it looks right.
      - name: Keep the screenshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-screenshot
          path: apps/desktop/web/card-verify.png
          if-no-files-found: warn
