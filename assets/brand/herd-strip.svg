<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 110" width="780" height="110" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <!-- sleep capybara (origin at body center) -->
    <g id="s">
      <ellipse cx="0" cy="0" rx="28" ry="16" fill="#8B6239"/>
      <rect x="-22" y="12" width="7" height="9" rx="3.5" fill="#7A5530"/>
      <rect x="-4" y="12" width="7" height="9" rx="3.5" fill="#7A5530"/>
      <rect x="20" y="-18" width="30" height="24" rx="11" fill="#8B6239"/>
      <ellipse cx="29" cy="-21" rx="4" ry="5" fill="#7A5530"/>
      <path d="M33,-4 q3.5,3 7,0" stroke="#161616" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <ellipse cx="50" cy="0" rx="3" ry="2.5" fill="#5C4023"/>
    </g>
    <!-- awake capybara -->
    <g id="a">
      <ellipse cx="0" cy="0" rx="28" ry="16" fill="#8B6239"/>
      <rect x="-22" y="12" width="7" height="9" rx="3.5" fill="#7A5530"/>
      <rect x="-4" y="12" width="7" height="9" rx="3.5" fill="#7A5530"/>
      <rect x="20" y="-18" width="30" height="24" rx="11" fill="#8B6239"/>
      <ellipse cx="29" cy="-21" rx="4" ry="5" fill="#7A5530"/>
      <circle cx="37" cy="-4" r="2.5" fill="#161616"/>
      <ellipse cx="50" cy="0" rx="3" ry="2.5" fill="#5C4023"/>
    </g>
    <!-- needs-you capybara -->
    <g id="n">
      <ellipse cx="0" cy="0" rx="28" ry="16" fill="#8B6239"/>
      <rect x="-22" y="12" width="7" height="15" rx="3.5" fill="#7A5530"/>
      <rect x="-4" y="12" width="7" height="15" rx="3.5" fill="#7A5530"/>
      <rect x="20" y="-18" width="30" height="24" rx="11" fill="#8B6239"/>
      <ellipse cx="29" cy="-21" rx="4" ry="5" fill="#7A5530"/>
      <circle cx="37" cy="-4" r="2.5" fill="#161616"/>
      <ellipse cx="50" cy="0" rx="3" ry="2.5" fill="#5C4023"/>
      <!-- Sign -->
      <rect x="18" y="-36" width="34" height="20" rx="4" fill="#FBF7F0" stroke="#F2705A" stroke-width="1.5"/>
      <text x="35" y="-22" font-size="9" font-weight="700" fill="#F2705A" text-anchor="middle">oi!</text>
      <rect x="33" y="-14" width="4" height="8" rx="2" fill="#F2705A"/>
    </g>
  </defs>

  <!-- Tuca - needs-you (coral "oi!" sign) -->
  <use href="#n" transform="translate(65, 48) scale(0.70)"/>
  <text x="65" y="98" font-size="11" font-weight="700" fill="#F2705A" text-anchor="middle">Tuca</text>

  <!-- Bia - sleep -->
  <use href="#s" transform="translate(195, 50) scale(0.70)"/>
  <text x="195" y="98" font-size="11" fill="#8B8B8B" text-anchor="middle">Bia</text>

  <!-- Nina - awake -->
  <use href="#a" transform="translate(325, 48) scale(0.70)"/>
  <text x="325" y="98" font-size="11" fill="#4E8C5A" text-anchor="middle">Nina</text>

  <!-- Zeca - awake -->
  <use href="#a" transform="translate(455, 48) scale(0.70)"/>
  <text x="455" y="98" font-size="11" fill="#4E8C5A" text-anchor="middle">Zeca</text>

  <!-- Joca - sleep -->
  <use href="#s" transform="translate(585, 50) scale(0.70)"/>
  <text x="585" y="98" font-size="11" fill="#8B8B8B" text-anchor="middle">Joca</text>

  <!-- Duda - sleep -->
  <use href="#s" transform="translate(715, 50) scale(0.70)"/>
  <text x="715" y="98" font-size="11" fill="#8B8B8B" text-anchor="middle">Duda</text>
</svg>