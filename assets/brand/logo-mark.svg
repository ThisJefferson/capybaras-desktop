<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Capybaras">
  <title>Capybaras</title>
  <desc>The Copacabana calcadao wave, as an app mark. Black basalt and white limestone Portuguese pavement, laid along Avenida Atlantica in 1905-06. A public design for a place, not a company's mark.</desc>

  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="#0F5C63" />

    <g fill="#FBF7F0">
      <!-- Three bands, two wavelengths across, alternating crest and trough.
           Few elements on purpose: this has to survive 16 pixels. -->
      <path d="M 0,138 C 46,114 82,114 128,138 C 174,162 210,162 256,138 C 302,114 338,114 384,138 C 430,162 466,162 512,138 L 512,166 C 466,190 430,190 384,166 C 338,142 302,142 256,166 C 210,190 174,190 128,166 C 82,142 46,142 0,166 Z" />
      <path d="M 0,242 C 46,218 82,218 128,242 C 174,266 210,266 256,242 C 302,218 338,218 384,242 C 430,266 466,266 512,242 L 512,270 C 466,294 430,294 384,270 C 338,246 302,246 256,270 C 210,294 174,294 128,270 C 82,246 46,246 0,270 Z" />
      <path d="M 0,346 C 46,322 82,322 128,346 C 174,370 210,370 256,346 C 302,322 338,322 384,346 C 430,370 466,370 512,346 L 512,374 C 466,398 430,398 384,374 C 338,350 302,350 256,374 C 210,398 174,398 128,374 C 82,350 46,350 0,374 Z" />
    </g>
  </g>
</svg>
