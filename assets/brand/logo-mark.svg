<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Capybaras">
  <title>Capybaras</title>
  <desc>The Copacabana calcadao wave as an app mark: black basalt and white limestone Portuguese pavement, laid along Avenida Atlantica in 1905-06. A public design for a place, not a company's mark.</desc>

  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="#0F5C63" />

    <!-- Stroked, not filled: rounded caps and joins read as laid pavement
         rather than as clipped bars, and the bands can be inset from the
         edge instead of crashing into the rounded corners.

         The middle band is MIRRORED relative to its neighbours. Three
         identical bands read as a mechanical diagram; alternating them reads
         as a weave, which is what the real pavement does. -->
    <g fill="none" stroke="#FBF7F0" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 60,152 C 95,130 123,130 158,152 C 193,174 221,174 256,152 C 291,130 319,130 354,152 C 389,174 417,174 452,152" />
      <path d="M 60,256 C 95,278 123,278 158,256 C 193,234 221,234 256,256 C 291,278 319,278 354,256 C 389,234 417,234 452,256" />
      <path d="M 60,360 C 95,338 123,338 158,360 C 193,382 221,382 256,360 C 291,338 319,338 354,360 C 389,382 417,382 452,360" />
    </g>
  </g>
</svg>
