<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" width="960" height="328" role="img" aria-label="Capybaras">
  <title>Capybaras</title>
  <desc>The Capybaras lockup: the calcadao mark, and the wordmark.</desc>

  <defs>
    <clipPath id="mark-clip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <!-- Mark. The squircle spans 44..284 vertically, so its optical centre is
       y=164; the wordmark baseline below is set to centre its x-height there
       rather than to centre its bounding box, which is what made the previous
       attempt sit low (the descenders in "p" and "y" were pulling it down). -->
  <g transform="translate(48,44) scale(0.46875)">
    <g clip-path="url(#mark-clip)">
      <rect width="512" height="512" fill="#0F5C63" />
      <g fill="none" stroke="#FBF7F0" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 60,152 C 95,130 123,130 158,152 C 193,174 221,174 256,152 C 291,130 319,130 354,152 C 389,174 417,174 452,152" />
        <path d="M 60,256 C 95,278 123,278 158,256 C 193,234 221,234 256,256 C 291,278 319,278 354,256 C 389,234 417,234 452,256" />
        <path d="M 60,360 C 95,338 123,338 158,360 C 193,382 221,382 256,360 C 291,338 319,338 354,360 C 389,382 417,382 452,360" />
      </g>
    </g>
  </g>

  <!-- Wordmark.
       Set in the system display face for now. A bundled OFL rounded geometric
       sans is the follow-up (see docs/plans/M4-visual-design.md, step 2), so the
       wordmark can improve without the mark changing. -->
  <text
    x="328"
    y="193"
    font-family="'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif"
    font-size="112"
    font-weight="600"
    letter-spacing="-2.5"
    fill="#0F5C63">Capybaras</text>
</svg>
