<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#0F5C63" flood-opacity="0.10"/>
    </filter>
    <filter id="hero" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#F2705A" flood-opacity="0.22"/>
    </filter>

    <!-- dozing capybara -->
    <g id="capy-sleep">
      <ellipse cx="55" cy="52" rx="34" ry="20" fill="#8B6239"/>
      <rect x="30" y="64" width="8" height="11" rx="4" fill="#7A5530"/>
      <rect x="52" y="64" width="8" height="11" rx="4" fill="#7A5530"/>
      <rect x="76" y="30" width="36" height="30" rx="13" fill="#8B6239"/>
      <ellipse cx="86" cy="27" rx="5" ry="6" fill="#7A5530"/>
      <path d="M91,44 q4,3.5 8,0" stroke="#161616" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="109" cy="49" rx="3.6" ry="3" fill="#5C4023"/>
    </g>

    <!-- awake capybara -->
    <g id="capy-awake">
      <ellipse cx="55" cy="52" rx="34" ry="20" fill="#8B6239"/>
      <rect x="30" y="64" width="8" height="11" rx="4" fill="#7A5530"/>
      <rect x="52" y="64" width="8" height="11" rx="4" fill="#7A5530"/>
      <rect x="76" y="30" width="36" height="30" rx="13" fill="#8B6239"/>
      <ellipse cx="86" cy="27" rx="5" ry="6" fill="#7A5530"/>
      <circle cx="95" cy="44" r="2.8" fill="#161616"/>
      <ellipse cx="109" cy="49" rx="3.6" ry="3" fill="#5C4023"/>
    </g>

    <!-- the one who asks -->
    <g id="capy-needsyou">
      <use href="#capy-awake"/>
      <rect x="86" y="-30" width="42" height="26" rx="5" fill="#FBF7F0" stroke="#F2705A" stroke-width="2"/>
      <text x="107" y="-12" font-size="11" font-weight="700" fill="#F2705A" text-anchor="middle">oi!</text>
      <rect x="104" y="2" width="4" height="10" rx="2" fill="#F2705A"/>
    </g>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="780" fill="#FBF7F0"/>

  <!-- header with wavy calçadão bottom edge -->
  <path d="M0,0 H1200 V46
    q-30,12 -60,0 q-30,-12 -60,0 q-30,12 -60,0 q-30,-12 -60,0
    q-30,12 -60,0 q-30,-12 -60,0 q-30,12 -60,0 q-30,-12 -60,0
    q-30,12 -60,0 q-30,-12 -60,0 q-30,12 -60,0 q-30,-12 -60,0
    q-30,12 -60,0 q-30,-12 -60,0 q-30,12 -60,0 q-30,-12 -60,0
    q-30,12 -60,0 q-30,-12 -60,0 q-30,12 -60,0 q-30,-12 -60,0
    Z" fill="#0F5C63"/>

  <text x="40" y="40" font-size="25" font-weight="700" fill="#FBF7F0" letter-spacing="0.5">Capybaras</text>
  <text x="196" y="39" font-size="14" fill="#CFE7E6" opacity="0.85">the agents that ask first</text>

  <!-- money pill -->
  <rect x="960" y="12" width="200" height="32" rx="16" fill="#FFFFFF" opacity="0.15"/>
  <text x="1060" y="33" font-size="13" fill="#FBF7F0" text-anchor="middle">this month: $3.41 of $10</text>

  <!-- ============ CHAT PANEL ============ -->
  <rect x="40" y="96" width="600" height="500" rx="16" fill="#FFFFFF" filter="url(#card)"/>
  <text x="66" y="130" font-size="12" font-weight="700" fill="#0F5C63" letter-spacing="1.4">TUCA</text>

  <!-- user message -->
  <rect x="330" y="148" width="284" height="52" rx="14" fill="#CFE7E6"/>
  <text x="352" y="172" font-size="14" fill="#161616">clear out my old draft files please</text>
  <text x="352" y="190" font-size="14" fill="#161616">anything from before June</text>

  <!-- agent reply -->
  <rect x="66" y="220" width="360" height="70" rx="14" fill="#FBF7F0"/>
  <text x="86" y="246" font-size="14" fill="#161616">On it. Nina found 3 old drafts, and</text>
  <text x="86" y="266" font-size="14" fill="#161616">Tuca wants your nod before deleting</text>
  <text x="86" y="286" font-size="14" fill="#161616">them. Sign is up &#8594;</text>

  <!-- working indicator -->
  <rect x="66" y="308" width="230" height="40" rx="20" fill="#FBF7F0"/>
  <use href="#capy-awake" transform="translate(76,296) scale(0.30)"/>
  <text x="128" y="333" font-size="13" fill="#4E8C5A" font-weight="600">Zeca is checking that now…</text>

  <!-- quiet footer note -->
  <text x="66" y="392" font-size="12" fill="#8B8B8B">Nothing has been deleted yet.</text>

  <!-- spend line -->
  <rect x="66" y="530" width="548" height="42" rx="12" fill="#FBF7F0"/>
  <text x="86" y="556" font-size="13" fill="#161616">This month: <tspan font-weight="700" fill="#0F5C63">$3.41</tspan> of $10. Cap reached? The capybaras stop and tell you.</text>

  <!-- ============ APPROVAL CARD (HERO) ============ -->
  <rect x="676" y="96" width="484" height="286" rx="18" fill="#FFFFFF" filter="url(#hero)"/>
  <rect x="676" y="96" width="7" height="286" rx="3.5" fill="#F2705A"/>

  <use href="#capy-awake" transform="translate(700,110) scale(0.52)"/>

  <text x="770" y="140" font-size="12" font-weight="700" fill="#F2705A" letter-spacing="1.3">TUCA NEEDS YOU</text>
  <text x="770" y="170" font-size="17" font-weight="700" fill="#161616">Delete 3 files from</text>
  <text x="770" y="192" font-size="17" font-weight="700" fill="#161616">Documents?</text>

  <text x="708" y="230" font-size="14" font-weight="700" fill="#161616">This can't be undone.</text>
  <text x="708" y="254" font-size="13" fill="#4A4A4A">Why: you asked me to clear out</text>
  <text x="708" y="272" font-size="13" fill="#4A4A4A">drafts from before June.</text>

  <!-- buttons: Hold on is default (filled) -->
  <rect x="708" y="300" width="150" height="46" rx="23" fill="#0F5C63"/>
  <text x="783" y="329" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Hold on</text>
  <text x="783" y="362" font-size="10" fill="#8B8B8B" text-anchor="middle">default · press Enter</text>

  <rect x="874" y="300" width="150" height="46" rx="23" fill="none" stroke="#D8D2C6" stroke-width="1.5"/>
  <text x="949" y="329" font-size="15" font-weight="600" fill="#6B6B6B" text-anchor="middle">Go ahead</text>

  <!-- ============ ACTIVITY LOG ============ -->
  <rect x="676" y="402" width="484" height="194" rx="16" fill="#FFFFFF" filter="url(#card)"/>
  <text x="700" y="432" font-size="12" font-weight="700" fill="#0F5C63" letter-spacing="1.4">WHAT JUST HAPPENED</text>
  <text x="700" y="462" font-size="13" fill="#161616">Nina read 6 files from Documents</text>
  <text x="700" y="486" font-size="13" fill="#161616">Zeca confirmed 3 are unused since May</text>
  <text x="700" y="510" font-size="13" fill="#161616">Joca found nothing else to touch</text>
  <text x="700" y="542" font-size="13" font-weight="700" fill="#4E8C5A">Nothing was changed. Nothing was sent.</text>
  <text x="700" y="570" font-size="12" fill="#8B8B8B">Undo available for 30 days, if you say go ahead.</text>

  <!-- ============ THE HERD ============ -->
  <rect x="40" y="620" width="1120" height="120" rx="18" fill="#CFE7E6" opacity="0.55"/>

  <text x="66" y="652" font-size="12" font-weight="700" fill="#0F5C63" letter-spacing="1.4">THE HERD</text>

  <!-- Tuca needs you (front, with sign) -->
  <use href="#capy-needsyou" transform="translate(70,668) scale(0.72)"/>
  <text x="116" y="748" font-size="11" font-weight="700" fill="#F2705A" text-anchor="middle">Tuca</text>

  <!-- Nina working -->
  <use href="#capy-awake" transform="translate(240,678) scale(0.66)"/>
  <text x="286" y="748" font-size="11" fill="#6B6B6B" text-anchor="middle">Nina</text>

  <!-- Zeca working -->
  <use href="#capy-awake" transform="translate(400,678) scale(0.66)"/>
  <text x="446" y="748" font-size="11" fill="#6B6B6B" text-anchor="middle">Zeca</text>

  <!-- dozing three -->
  <use href="#capy-sleep" transform="translate(560,690) scale(0.60)"/>
  <text x="596" y="748" font-size="11" fill="#9A9A9A" text-anchor="middle">Bia</text>

  <use href="#capy-sleep" transform="translate(710,690) scale(0.60)"/>
  <text x="746" y="748" font-size="11" fill="#9A9A9A" text-anchor="middle">Joca</text>

  <use href="#capy-sleep" transform="translate(860,690) scale(0.60)"/>
  <text x="896" y="748" font-size="11" fill="#9A9A9A" text-anchor="middle">Duda</text>

  <!-- legend -->
  <circle cx="1020" cy="700" r="6" fill="#F2705A"/>
  <text x="1036" y="704" font-size="12" fill="#161616">needs you</text>
  <circle cx="1020" cy="726" r="6" fill="#4E8C5A"/>
  <text x="1036" y="730" font-size="12" fill="#161616">working</text>
</svg>
